<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Game</title>
</head>

<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .game{
        background: white;
        padding: 30px;
        border-radius: 15px;
        text-align: center;
        width: 320px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    h1{
        color: #333;
    }

    p{
        color: #555;
    }

    input{
        padding: 12px;
        width: 80%;
        margin: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
    }

    button{
        padding: 12px 20px;
        background: #667eea;
        color: white;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        margin: 5px;
        font-size: 16px;
    }

    button:hover{
        background: #4c5fd5;
    }

</style>

<body>
    <div class="game">
        <h1>🎮 Guess the Number</h1>
        <p>Guess a number between 1 and 100</p>

        <input type="number" id ="guess" placeholder="enter your number" min="1" max="100">
        <br>
        <button onclick="checkGame()">Geuss</button>
        <button onclick="restartGame()">Restart</button>

        <p id="message">Good Luck!</p>
        <p>Attempts:<span id="attempts">0</span></p>
    </div>
</body>
<script>
    // genarate random numbers
    let randomNumber = Math.floor(Math.random() * 100)+1;
    
    // count attempts
    let attempts = 0;

    //game status
    let gameOver = false;

    function checkGame(){

        if(gameOver){
        return;
    }

        //get number
        let guess = Number(document.getElementById("guess").value);

        if(guess <1 || guess >100 || !Number.isInteger(guess)){
            document.getElementById("message").innerHTML = "Please Enter a number between 1 and 100";
            return;
        }

        //increase attempts
        attempts++;

        document.getElementById("attempts").innerHTML = attempts;

        //check the number
        if(guess === randomNumber){
            document.getElementById("message").innerHTML =
            "🎉Congratulations! You guessed correctly.!";
            gameOver = true;

        } else if (guess > randomNumber){
            document.getElementById("message").innerHTML = 
            "Too High! Try a smaller Number";
        
        }else{
            document.getElementById("message").innerHTML = 
            "Too Low! Try a bigger Number.";
        }
    }


    //game restart
    function restartGame(){

        randomNumber = Math.floor(Math.random() * 100)+1;

        attempts = 0;
        gameOver = false;

        document.getElementById("attempts").innerHTML = 0;

        document.getElementById("message").innerHTML = 
                     "New game started! Good luck!";
    

        document.getElementById("guess").value = "";

    }
</script>
</html>
